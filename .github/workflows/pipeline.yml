name: CI Pipeline Merging Test
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set Up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install Dependencies
      run: npm install

    - name: Run Tests
      run: npm test